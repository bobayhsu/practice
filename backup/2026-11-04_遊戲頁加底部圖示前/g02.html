<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1-16 變色賓果</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --panel: #fffdf7;
      --ink: #151515;
      --muted: #746c5f;
      --accent: #d52941;
      --latest: #1f7a4d;
      --line: #ded3bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    main {
      width: min(100%, 1180px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .title-block {
      display: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .status {
      color: var(--muted);
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      white-space: nowrap;
    }

    .draw,
    .reset {
      border: 2px solid var(--accent);
      background: var(--panel);
      color: var(--accent);
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .draw {
      width: 46px;
      padding: 0;
      font-size: 20px;
    }

    .draw:disabled {
      opacity: .45;
      cursor: default;
    }

    .draw:disabled:hover {
      background: var(--panel);
      color: var(--accent);
    }

    .draw:hover,
    .reset:hover {
      background: var(--accent);
      color: #fff;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, 1vw, 12px);
      padding: clamp(6px, 1vw, 10px);
      background: rgba(255,255,255,.45);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 28px rgba(60, 45, 20, .14);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, min(78vh, 820px)) minmax(150px, 220px);
      gap: clamp(8px, 1.4vw, 16px);
      align-items: start;
      justify-content: center;
    }

    .number-panel {
      background: rgba(255,255,255,.64);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(60, 45, 20, .12);
    }

    .number-panel h2 {
      margin: 0 0 10px;
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .number-reference {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }

    .tile {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, filter .18s ease;
    }

    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }

    .number-tile {
      background: #fff;
      border: 3px solid #171717;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
    }

    .tile-number {
      position: relative;
      z-index: 1;
      color: #050505;
      font-size: clamp(52px, 8vw, 132px);
      font-weight: 900;
      line-height: 1;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    .tile:hover {
      transform: translateY(-2px) scale(1.01);
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background: rgba(213, 41, 65, .68);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }

    .tile.selected::after {
      opacity: 1;
    }

    .tile.latest::after {
      background: rgba(31, 122, 77, .72);
      opacity: 1;
    }

    .tile.selected {
      filter: saturate(1.1) contrast(1.04);
    }

    .tile.selected img {
      box-shadow: 0 0 0 5px var(--accent), 0 8px 18px rgba(213, 41, 65, .28);
    }

    .number-tile.selected {
      box-shadow: 0 0 0 5px var(--accent), 0 8px 18px rgba(213, 41, 65, .28);
    }

    .tile.latest img {
      box-shadow: 0 0 0 6px var(--latest), 0 8px 20px rgba(31, 122, 77, .34);
    }

    .number-tile.latest {
      box-shadow: 0 0 0 6px var(--latest), 0 8px 20px rgba(31, 122, 77, .34);
    }

    .tile.drawn {
      animation: drawPulse .72s ease;
    }

    @keyframes drawPulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.08); }
      70% { transform: scale(.98); }
      100% { transform: scale(1); }
    }

    @media (max-width: 720px) {
      body {
        padding: 8px;
        align-items: flex-start;
      }

      .toolbar {
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      .actions {
        margin-left: auto;
      }

      .board {
        border-radius: 12px;
        gap: 5px;
        padding: 5px;
      }

      .game-layout {
        grid-template-columns: 1fr;
      }

      .number-panel {
        border-radius: 12px;
      }

      .tile,
      .tile img {
        border-radius: 10px;
      }

      .tile-number {
        font-size: clamp(42px, 15vw, 90px);
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar" aria-label="遊戲工具列">
      <div>
        <h1>1-16 變色賓果</h1>
        <div class="status" id="status">已標記 0 張</div>
      </div>
      <div class="actions">
        <a class="reset" href="index.html" id="toGames" title="回遊戲目錄" aria-label="回遊戲目錄" style="width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg></a>
        <button class="draw" type="button" id="drawButton" title="抽一張" aria-label="抽一張">抽</button>
        <button class="reset" type="button" id="resetButton">重新開始</button>
      </div>
    </div>

    <div class="game-layout">
      <section class="board" aria-label="1到16賓果圖卡">
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
        <button class="tile number-tile" type="button" aria-pressed="false"><span class="tile-number"></span></button>
      </section>

      <aside class="number-panel" aria-label="0到9示意圖">
        <img class="number-reference" src="assets/reference-0-9.png" alt="0到9圖像示意表" onerror="this.closest('.number-panel').style.display='none';document.querySelector('.game-layout').style.gridTemplateColumns='minmax(0,min(78vh,820px))'">
      </aside>
    </div>
  </main>

  <script>
    const tiles = Array.from(document.querySelectorAll('.tile'));
    const statusEl = document.getElementById('status');
    const drawButton = document.getElementById('drawButton');
    const resetButton = document.getElementById('resetButton');

    function shuffleNumbers() {
      const numbers = Array.from({ length: tiles.length }, (_, index) => index + 1);
      for (let i = numbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
      }

      tiles.forEach((tile, index) => {
        const number = numbers[index];
        const label = tile.querySelector('.tile-number');
        if (label) label.textContent = number;
        tile.dataset.number = number;
        tile.setAttribute('aria-label', `標記 ${number}`);
      });
    }

    function updateStatus() {
      const selected = tiles.filter(tile => tile.classList.contains('selected')).length;
      statusEl.textContent = selected === 16 ? '全部標記了' : `已標記 ${selected} 張`;
      drawButton.disabled = selected === tiles.length;
    }

    function markTile(tile) {
      tiles.forEach(item => item.classList.remove('latest'));
      tile.classList.add('selected');
      tile.classList.add('latest');
      tile.setAttribute('aria-pressed', 'true');
      tile.classList.remove('drawn');
      void tile.offsetWidth;
      tile.classList.add('drawn');
      updateStatus();
    }

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        tile.classList.toggle('selected');
        tile.classList.remove('latest');
        tile.setAttribute('aria-pressed', String(tile.classList.contains('selected')));
        updateStatus();
      });
    });

    drawButton.addEventListener('click', () => {
      const available = tiles.filter(tile => !tile.classList.contains('selected'));
      if (available.length === 0) return;
      const picked = available[Math.floor(Math.random() * available.length)];
      markTile(picked);
    });

    resetButton.addEventListener('click', () => {
      tiles.forEach(tile => {
        tile.classList.remove('selected');
        tile.classList.remove('latest');
        tile.classList.remove('drawn');
        tile.setAttribute('aria-pressed', 'false');
      });
      shuffleNumbers();
      updateStatus();
    });

    shuffleNumbers();
    updateStatus();
    document.getElementById('toGames').addEventListener('click', e => { e.preventDefault(); location.replace('index.html'); });
  </script>
</body>
</html>
