<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故事賓果｜16 道人生求救題</title>
<style>

:root{
  --bg-1:#F8F5EE;
  --bg-2:#ECE5D4;
  --surface:#FFFFFF;
  --border:#E3DDC9;
  --ink:#2A2924;
  --muted:#9C9686;
  --accent:#D7263D;
  --accent-dark:#A81F30;
  --accent-soft:#FCEAEA;
  --lit-bg:#EAF2FC;
  --lit-border:#3E82C7;
  --lit-ink:#1B5A93;
  --win-from:#22B37F;
  --win-to:#0F8F63;
  --win-border:#0B6B4D;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(42,41,36,.06);
  --shadow-md:0 8px 20px rgba(42,41,36,.10);
  --shadow-lg:0 16px 36px rgba(42,41,36,.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
  color: var(--ink);
  padding: 10px 12px;
}
.header, #status { display: none !important; }

.wrap {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.layout {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  gap: 12px;
  align-items: stretch;
}

/* ---------- 左側題目板 ---------- */
#boardPanel {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  border: 1px solid rgba(227,221,201,.78);
  border-radius: var(--radius-lg);
  background: rgba(255,255,255,.26);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
  padding: 0;
  overflow: visible;
  transition: flex-basis .22s ease, width .22s ease, min-width .22s ease, opacity .18s ease, padding .22s ease;
}
#board {
  position: relative;
  width: 100%;
  min-width: 0;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 6px;
}
.cell {
  position: relative;
  min-height: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-family: inherit;
  padding: 8px 26px 8px 10px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease, opacity .15s ease, background .15s ease;
}
.cell:active { transform: scale(0.98); }
.cell .q {
  width: 100%;
  text-align: left;
  font-size: clamp(13px, 1.25vw, 18px);
  line-height: 1.28;
  font-weight: 600;
  color: var(--ink);
}
.cell .num {
  position: absolute;
  right: 6px;
  bottom: 6px;
  color: var(--muted);
  font-size: clamp(12px, 1vw, 16px);
  font-weight: 700;
  line-height: 1;
}
.cell.lit { background: var(--lit-bg); border-color: var(--lit-border); }
.cell.lit .q { color: var(--lit-ink); font-weight: 800; }
.cell.lit .num { color: #6FA3D2; }
.cell.selected {
  border-color: var(--accent);
  box-shadow: var(--shadow-md), inset 0 0 0 2px rgba(215,38,61,.28);
  transform: translateY(-2px);
  z-index: 6;
}
.cell.selected .q { color: var(--accent-dark); font-weight: 900; }
.cell.selected .num { color: var(--accent); }
.cell.win {
  background: linear-gradient(135deg, var(--win-from), var(--win-to));
  border-color: var(--win-border);
  animation: winGlow 1.8s ease-in-out infinite;
}
.cell.win .q { color: #FFFFFF; font-weight: 800; }
.cell.win .num { color: rgba(255,255,255,.75); }
.cell.win.selected {
  outline: 3px solid var(--accent);
  outline-offset: -4px;
}
@keyframes winGlow {
  0%, 100% { box-shadow: var(--shadow-sm), 0 0 0 0 rgba(34,179,127,.45); }
  50% { box-shadow: var(--shadow-md), 0 0 0 8px rgba(34,179,127,0); }
}
#board .cell:first-child .q { padding-left: 38px; }

/* 滑入某格時，其餘格子變淡並凸顯該格 */
#board.dim-active .cell { opacity: .32; }
#board.dim-active .cell.hovering,
#board.dim-active .cell.hovering .q,
#board.dim-active .cell.hovering .num { opacity: 1; }
#board.dim-active .cell.hovering {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
  z-index: 5;
}
#board:not(.dim-active).locked-view .cell { opacity: 1; }

/* ---------- 題目板收合按鈕 ---------- */
#boardToggle {
  position: absolute;
  left: -10px;
  top: 48px;
  z-index: 110;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.94);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background .15s ease, color .15s ease, transform .15s ease, border-color .15s ease;
}
#boardToggle:hover { background: #F1EFE6; color: var(--ink); transform: translateY(-1px); }
#boardToggle.active { color: var(--accent); border-color: var(--accent); }
#boardToggle svg { width: 17px; height: 17px; }

/* ---------- 重新開始按鈕 ---------- */
.wrap > .btnrow {
  position: absolute;
  left: 10px;
  top: 10px;
  width: 0;
  height: 0;
  z-index: 100;
  pointer-events: none;
}
#reset {
  pointer-events: auto;
  width: 42px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #E4444B, var(--accent-dark));
  color: #FFFFFF;
  font-family: inherit;
  font-size: 22px;
  font-weight: 700;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform .15s ease, box-shadow .15s ease;
}
#reset:hover { transform: scale(1.08) rotate(-14deg); box-shadow: var(--shadow-lg); }
#reset:active { transform: scale(.96); }

#medbtn, #zoomReset, #placeholder { display: none !important; }

/* ---------- 故事欄收合按鈕 ---------- */
#panelToggle {
  position: absolute;
  right: 10px;
  top: 10px;
  z-index: 100;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.9);
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background .15s ease, color .15s ease, transform .15s ease;
}
#panelToggle:hover { background: #F1EFE6; color: var(--ink); }
#panelToggle.active { color: var(--accent); border-color: var(--accent); }
#panelToggle svg { width: 16px; height: 16px; }

/* ---------- 右側面板 ---------- */
.layout { transition: gap .2s ease; }
.layout.panel-collapsed { gap: 0; }
.layout.board-collapsed { gap: 8px; }
.layout.board-collapsed #boardPanel {
  flex: 0 0 52px;
  width: 52px;
  min-width: 52px;
  padding: 0;
  border-color: var(--accent);
  background: rgba(255,255,255,.72);
  overflow: hidden;
}
.layout.board-collapsed #board {
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}
.layout.board-collapsed #boardToggle {
  left: 10px;
  top: 10px;
}
.layout.board-collapsed #boardToggle svg {
  transform: rotate(180deg);
}
.layout.board-collapsed ~ .btnrow {
  opacity: 0;
  pointer-events: none;
}.layout.board-collapsed #panel {
  flex-basis: clamp(520px, 42vw, 680px);
  width: clamp(520px, 42vw, 680px);
  padding: 18px 16px 16px;
  gap: 14px;
}
.layout.board-collapsed #zoomSlot {
  width: 100%;
  min-height: 72px;
  padding: 14px 16px;
}
.layout.board-collapsed #zoomBox {
  align-items: center;
  justify-content: flex-start;
}
.layout.board-collapsed #zoomBox .zoom-q {
  display: block;
  width: auto;
  height: 100%;
  max-width: calc(100% - 34px);
  writing-mode: vertical-rl;
  text-orientation: mixed;
  overflow: visible;
  font-size: clamp(36px, 2.7vw, 54px);
  line-height: 1.45;
  font-weight: 900;
}
.layout.board-collapsed #zoomBox .zoom-num {
  font-size: clamp(26px, 1.75vw, 36px);
  right: 6px;
  bottom: 6px;
}
.layout.board-collapsed #panelMain {
  gap: 14px;
}
.layout.board-collapsed #qnum {
  flex-basis: 70px;
  width: 70px;
}
.layout.board-collapsed #qnum .qnum-value {
  font-size: clamp(40px, 2.55vw, 58px);
  line-height: 1.24;
}
.layout.board-collapsed #storyarea {
  gap: 18px;
}
.layout.board-collapsed #storyarea .stage {
  font-size: clamp(31px, 1.95vw, 44px);
  line-height: 1.45;
}
.layout.board-collapsed #storyarea .stage:not(:last-child) {
  padding-left: 18px;
}
.layout.board-collapsed .tag {
  font-size: clamp(25px, 1.5vw, 34px);
  padding: 8px 6px;
  margin-bottom: 12px;
}
#panel {
  transition: flex-basis .2s ease, width .2s ease, opacity .15s ease, padding .2s ease;
}
.layout.panel-collapsed #panel {
  flex-basis: 0 !important;
  width: 0 !important;
  min-width: 0 !important;
  padding: 0 !important;
  opacity: 0 !important;
  overflow: hidden !important;
  pointer-events: none !important;
  border-width: 0 !important;
}
.layout.panel-collapsed #zoomSlot {
  aspect-ratio: auto !important;
  height: 0 !important;
  min-height: 0 !important;
  width: 0 !important;
  min-width: 0 !important;
  padding: 0 !important;
  border-width: 0 !important;
}
.layout.panel-collapsed #panelMain,
.layout.panel-collapsed #qnum,
.layout.panel-collapsed #storyarea .stage {
  width: 0 !important;
  min-width: 0 !important;
  flex-basis: 0 !important;
}
.layout.panel-collapsed #board .cell:nth-child(4) .q { padding-right: 30px; }
#panel {
  flex: 0 0 clamp(260px, 23vw, 340px);
  width: clamp(260px, 23vw, 340px);
  height: 100%;
  min-height: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 14px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}
#zoomSlot {
  flex: 0 0 auto;
  width: 100%;
  align-self: center;
  height: var(--right-question-height, 56px);
  aspect-ratio: var(--cell-aspect, 1.85);
  min-height: 36px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
  background: #FBFAF5;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: border-color .15s ease, background .15s ease;
}
#zoomSlot:has(#zoomBox.locked) {
  border: 1px solid var(--accent);
  background: var(--accent-soft);
}
#zoomBox {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  height: 100%;
  color: var(--ink);
  font-weight: 600;
  line-height: 1.28;
  white-space: normal;
  word-break: break-word;
}
#zoomBox:empty::before {
  content: "滑到左側題目，看放大內容";
  color: var(--muted);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .5px;
}
#zoomBox .zoom-q {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  width: 100%;
  min-width: 0;
  font-size: clamp(19px, 1.65vw, 26px);
  line-height: 1.34;
  font-weight: 700;
  color: var(--ink);
}
#zoomBox.locked { cursor: pointer; }
#zoomBox.locked .zoom-q { color: var(--accent-dark); }
#zoomBox .zoom-num {
  position: absolute;
  right: 2px;
  bottom: 2px;
  color: var(--muted);
  font-size: 16px;
  font-weight: 700;
}

#panelMain {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: row-reverse;
  align-items: stretch;
  gap: 10px;
  overflow: hidden;
}
#qnum {
  flex: 0 0 42px;
  width: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
  writing-mode: vertical-rl;
  text-orientation: mixed;
}
#qnum .qnum-value {
  display: inline-block;
  color: var(--accent-dark);
  font-weight: 900;
  font-size: clamp(22px, 1.75vw, 30px);
  line-height: 1.32;
  letter-spacing: 1px;
}

#storyarea {
  flex: 1 1 auto;
  display: none;
  flex-direction: row-reverse;
  align-items: flex-start;
  gap: 10px;
  min-width: 0;
}
#storyarea .stage {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif;
  font-size: clamp(19px, 1.45vw, 25px);
  line-height: 1.5;
  letter-spacing: .5px;
  color: var(--ink);
}
#storyarea .stage:not(:last-child) {
  border-left: 1px dashed var(--border);
  padding-left: 10px;
}
.tag {
  display: inline-block;
  background: #181818;
  color: #FFFFFF;
  font-family: "DFKai-SB", "BiauKai", "標楷體", "KaiTi", serif;
  font-weight: 700;
  font-size: clamp(16px, 1.2vw, 21px);
  line-height: 1.1;
  letter-spacing: .5px;
  padding: 5px 3px;
  margin: 0 0 8px 0;
  border-radius: 5px;
}
.tag.t1 { box-shadow: inset 0 -3px 0 #A9A48F; }
.tag.t2 { box-shadow: inset 0 -3px 0 #F1C948; }
.tag.t3 { box-shadow: inset 0 -3px 0 #2FAE79; }

@media (max-width: 860px) {
  html, body { overflow: auto; height: auto; }
  body { min-height: 100vh; }
  .layout { flex-direction: column; }
  #boardPanel { height: auto; min-height: 520px; }
  #board { grid-template-rows: repeat(4, minmax(92px, auto)); height: auto; }
  .layout.board-collapsed #boardPanel { flex-basis: 46px; width: 46px; min-width: 46px; min-height: 46px; }
  #panel { width: 100%; flex: 0 0 400px; height: 400px; }
  #zoomSlot { flex-basis: 56px; height: 56px; min-height: 36px; }
  #panelMain { min-height: 250px; }
}

<script>

  "尼克胡哲的擁抱",
  "曼德拉走出監獄",
  "費德勒的眼淚",

const tales = [
  ["他以為自己連校隊都進不了，就是沒有天分。","被刷掉後，他把難過變成每天更早、更久的練習。","後來大家記住的，不是落選的人，而是籃球之神。"],
  ["田忌照原本配法賽馬，一定會輸。","孫臏讓他先輸一局，換來後面兩局的勝利。","認輸不是丟臉，有時是看清全局的策略。"],
  ["愛麗絲站在岔路口，急著問哪條路才對。","柴郡貓問她想去哪裡，她卻答不出來。","不知道喜歡什麼時，先開始走，答案會在路上出現。"],
  ["梵谷也曾想走安穩的路，卻一次次失敗。","他後來拿起畫筆，日子仍不穩，心卻有了方向。","夢想不是逃離現實，而是願意為某件事承擔。"],
  ["大家笑萊特兄弟，覺得人不可能飛上天。","他們一次次試飛、摔壞、修正，還是沒有停下。","反對聲不一定代表你錯，有時只是別人還沒看見。"],
  ["她年紀大了，手也不方便，像是只能放下新開始。","摩西奶奶七十多歲才認真畫畫，慢慢被世界看見。","重來不怕晚，怕的是你以為晚了就不能開始。"],
  ["科學家原本想做強力膠，卻做出黏不牢的膠水。","同事換個角度，把失敗拿來做可撕下的書籤。","選錯不一定全毀，有時只是用途還沒被找到。"],

  ["海倫看不見、聽不見，像被困在黑暗裡。","老師安妮一次次陪她，把水這個字放進她心裡。","走不出來時，先抓住一個願意陪你的人和一個小出口。"],

  ["曼德拉被關進監獄二十七年，理由充滿不公平。","出獄後，他沒有把國家帶向報復，而是選擇和解。","原諒不是說傷害沒發生，而是不再讓傷害掌控自己。"],

const outlines = [
  "喬丹年輕時曾因表現不夠好，連高中校隊都沒選上。那次被淘汰讓他非常難過，回家後甚至哭了出來。\n但他沒有因此放棄，反而把挫敗變成訓練的力量，天天更早到球場、練得更久、更專注。\n後來，那個曾經被刷掉的男孩，成了籃球之神。這個故事告訴我們，覺得自己什麼都做不好，不一定表示你沒有天分，而是你還在一段需要累積、需要打磨的路上。",
  "田忌與齊王賽馬，照原本的配法一定會輸。\n孫臏卻建議他故意用下等馬去對齊王的上等馬，先輸掉第一局，再用上等馬去贏中等馬，用中等馬去贏下等馬，最後反而拿下整場勝利。\n這個故事提醒我們，認輸不一定是丟臉，有時它只是策略的一部分。真正重要的不是每一局都要贏，而是你有沒有看清全局，知道什麼時候該退一步，換來最後的勝利。",
  "愛麗絲走到岔路口，不知道該往哪裡去，於是問柴郡貓哪條路才對。貓反問她想去什麼地方，愛麗絲說自己其實也不知道。\n貓便回答，如果你不知道要去哪裡，那麼走哪一條路其實都差不多。\n這句話讓愛麗絲明白，真正困住人的，常常不是選項太多，而是不知道自己想成為什麼樣的人。當你不知道喜歡什麼時，與其一直停著，不如先開始走，答案會在路上慢慢出現。",
  "梵谷曾經做過畫商、教師、傳教士，卻在許多穩定道路上走得跌跌撞撞。後來他選擇畫畫，生活並沒有立刻變好，甚至常常貧窮、孤單、不被理解。\n可是他仍把心裡看見的星空、麥田與人，努力畫下來。\n這個故事不是叫人不顧現實，而是提醒我們，穩定和夢想不一定只是二選一。真正的夢想不是逃走，而是你願意慢慢把它變成能承擔的生活。",
  "萊特兄弟想讓人類飛上天空時，許多人覺得那只是荒唐的幻想。當時沒有豪華實驗室，也沒有很多人相信他們。\n他們一邊修腳踏車，一邊研究風、翅膀和引擎，一次又一次試飛、失敗、摔壞、修正。\n最後，飛機真的離開地面。這個故事提醒我們，大家反對不一定表示你錯，也可能只是他們還沒看見你看見的畫面。但堅持不是硬撐，而是願意用行動證明。",
  "摩西奶奶年輕時忙著工作、結婚、照顧家庭，畫畫一直不是她人生的主角。年紀大了以後，她因為手指不方便，不能再做原本喜歡的刺繡，才開始認真畫畫。\n她已經七十多歲，卻一筆一筆畫出鄉村生活，後來成為美國知名畫家。\n這個故事告訴我們，轉行、重來，不一定有標準年齡。太遲常常不是時間說的，而是恐懼說的。只要還能開始，就還有新的路。",
  "有位科學家原本想發明強力膠，結果卻做出一種黏性不夠強、一下就能撕下來的膠水，看起來像是一次徹底失敗。\n可是另一位同事忽然想到，這種膠正好可以用來做書籤，貼上去不會掉，撕下來也不傷紙。\n後來，這個失敗的發明竟變成全世界都在用的便利貼。人生的選擇也是如此，走錯了、做歪了，不一定全盤作廢，有時只是還沒找到它真正該去的地方。",
  "桑德斯上校，也就是後來的肯德基爺爺，年輕時換過許多工作，當過農場工人、售票員、加油站經營者，也經歷過不少失敗。\n到了很多人準備退休的年紀，他仍帶著炸雞配方四處拜訪餐廳，被拒絕很多次後，才慢慢找到機會。\n這個故事提醒我們，不知道要做什麼不代表你的人生落後。有些人的方向很早出現，有些人則是在走過很多彎路後，才把經驗煮成自己的味道。",
  "海倫凱勒小時候因病失去視力與聽力，像被困在沒有聲音也沒有光的世界裡。她急躁、憤怒，也說不出心裡的需要。\n老師安妮來到她身邊，一次次陪她練習，直到有一天在水流旁，海倫突然明白手心裡的符號代表水。\n從那一刻開始，世界慢慢打開。這個故事告訴我們，走不出來時，不一定要立刻走很遠。先抓住一個字、一個人、一個小出口，光就可能慢慢進來。",
  "尼克胡哲一出生就沒有四肢，從小面對許多不方便，也曾深深懷疑為什麼是自己，甚至覺得生命沒有希望。\n可是後來，他慢慢學會用自己的方式生活，也開始到世界各地演講，把痛苦、掙扎與勇氣分享給別人。\n這個故事不是說痛苦很好，而是說痛苦不等於你做錯了什麼。有些遭遇沒有簡單答案，但人仍可能在破碎之處長出力量，甚至成為別人的安慰。",

const BOARD_SIZE = 4;
const CELL_COUNT = BOARD_SIZE * BOARD_SIZE;
const lines = [];
for (let r = 0; r < BOARD_SIZE; r++) {
  const row = [];
  for (let c = 0; c < BOARD_SIZE; c++) row.push(r * BOARD_SIZE + c);
  lines.push(row);
}
for (let c = 0; c < BOARD_SIZE; c++) {
  const col = [];
  for (let r = 0; r < BOARD_SIZE; r++) col.push(r * BOARD_SIZE + c);
  lines.push(col);
}
lines.push([0, 5, 10, 15]);
lines.push([3, 6, 9, 12]);

let lit = Array(CELL_COUNT).fill(false);
let over = false;
let winCells = null;
let shownQ = -1;
let selectedQ = -1;
const board = document.getElementById('board');
const status = document.getElementById('status');
const qnum = document.getElementById('qnum');
const medbtn = document.getElementById('medbtn');
const placeholder = document.getElementById('placeholder');
const storyarea = document.getElementById('storyarea');
const s1 = document.getElementById('s1');
const s2 = document.getElementById('s2');
const s3 = document.getElementById('s3');

function showStory(i) {
  shownQ = i;
  selectedQ = i;
  qnum.innerHTML = '<span class="qnum-value">' + stories[i] + '</span>';
  qnum.style.display = 'flex';
  qnum.onclick = null;
  medbtn.textContent = '';
  medbtn.style.display = 'none';
  s1.textContent = tales[i][0];
  s2.textContent = tales[i][1];
  s3.textContent = tales[i][2];
  placeholder.style.display = 'none';
  storyarea.style.display = 'flex';
  if (layoutEl.classList.contains('board-collapsed')) {
    showOutlineInStoryColumns(i);
  }
}

function toggleTale() {
  if (shownQ === -1) return;
  const opened = s1.textContent || s2.textContent || s3.textContent;
  if (opened) {
    s1.textContent = '';
    s2.textContent = '';
    s3.textContent = '';
    qnum.innerHTML = '<span class="qnum-value"></span>';
    qnum.style.display = 'none';
    storyarea.style.display = 'none';
  } else {
    qnum.innerHTML = '<span class="qnum-value">' + stories[shownQ] + '</span>';
    qnum.style.display = 'flex';
    s1.textContent = tales[shownQ][0];
    s2.textContent = tales[shownQ][1];
    s3.textContent = tales[shownQ][2];
    storyarea.style.display = 'flex';
  }
}

function hideStory() {
  shownQ = -1;
  selectedQ = -1;
  qnum.innerHTML = '<span class="qnum-value"></span>';
  qnum.style.display = 'none';
  qnum.onclick = null;
  medbtn.style.display = 'none';
  s1.textContent = '';
  s2.textContent = '';
  s3.textContent = '';
  storyarea.style.display = 'none';
  placeholder.style.display = 'none';
}

function resetGame() {
  lit = Array(CELL_COUNT).fill(false);
  over = false;
  winCells = null;
  status.textContent = ''; // 已隱藏狀態列
  status.className = '';
  unlockZoom();
  hideStory();
  render();
}

let zoomLocked = -1;
const zoomBox = document.getElementById('zoomBox');
const zoomReset = document.getElementById('zoomReset');

function showZoom(i, cell, locked) {
  if (!cell) cell = board.children[i];
  if (!cell) return;
  zoomBox.style.removeProperty('display');
  zoomBox.innerHTML = '<span class="zoom-num">' + (i + 1) + '</span><span class="zoom-q">' + questions[i] + '</span>';
  zoomBox.classList.toggle('locked', !!locked);
  board.classList.remove('locked-view');
  if (locked) board.classList.add('locked-view');
  Array.from(board.children).forEach(function(c) { c.classList.remove('zoom-source'); });
  cell.classList.add('zoom-source');
  if (locked) {
    zoomLocked = i;
  }
}

function hideZoom() {
  if (zoomLocked !== -1) return;
  zoomBox.style.display = 'none';
  zoomBox.classList.remove('locked');
  board.classList.remove('zooming');
  board.classList.remove('locked-view');
  board.classList.remove('dim-active');
  Array.from(board.children).forEach(function(c) { c.classList.remove('zoom-source'); c.classList.remove('hovering'); });
}

function unlockZoom() {
  zoomLocked = -1;
  zoomBox.style.display = 'none';
  zoomBox.classList.remove('locked');
  board.classList.remove('zooming');
  board.classList.remove('locked-view');
  board.classList.remove('dim-active');
  Array.from(board.children).forEach(function(c) { c.classList.remove('zoom-source'); c.classList.remove('hovering'); });
}

function render() {
  board.innerHTML = '';
  for (let i = 0; i < CELL_COUNT; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell' +
      (winCells && winCells.includes(i) ? ' win' : lit[i] ? ' lit' : '') +
      (selectedQ === i ? ' selected' : '') +
      (zoomLocked === i ? ' zoom-source' : '');
    cell.setAttribute('aria-label', '第 ' + (i + 1) + ' 題：' + questions[i]);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;
    cell.appendChild(num);
    const q = document.createElement('span');
    q.className = 'q';
    q.textContent = questions[i];
    cell.appendChild(q);
    cell.onmouseenter = function() {
      board.classList.add('dim-active');
      Array.from(board.children).forEach(function(c) { c.classList.remove('hovering'); });
      cell.classList.add('hovering');
      showZoom(i, cell, false);
    };
    cell.onmouseleave = function() {
      cell.classList.remove('hovering');
      if (!board.querySelector('.cell.hovering')) {
        board.classList.remove('dim-active');
        if (zoomLocked !== -1) {
          const lockedCell = board.children[zoomLocked];
          if (lockedCell) showZoom(zoomLocked, lockedCell, true);
        } else {
          hideZoom();
        }
      }
    };
    cell.onclick = function() { tap(i); };
    board.appendChild(cell);
  }
  if (zoomLocked !== -1) {
    const lockedCell = board.children[zoomLocked];
    if (lockedCell) showZoom(zoomLocked, lockedCell, true);
  }
}

function tap(i) {
  if (lit[i] && selectedQ === i && !over) {
    lit[i] = false;
    hideStory();
    unlockZoom();
    render();
    return;
  }
  lit[i] = true;
  showStory(i);
  if (!winCells) {
    const win = lines.find(function(l) { return l.every(function(idx) { return lit[idx]; }); });
    if (win) {
      over = true;
      winCells = win;
      status.textContent = '';
      status.className = 'win';
    }
  }
  zoomLocked = i;
  if (layoutEl && layoutEl.classList.contains('board-collapsed')) updateOutlineBox();
  board.classList.add('locked-view');
  render();
}

function syncZoomSlotAspect() {
  const slot = document.getElementById('zoomSlot');
  const firstCell = board && board.children && board.children[0];
  if (!slot || !firstCell) return;
  const rect = firstCell.getBoundingClientRect();
  const panel = document.getElementById('panel');
  const panelRect = panel ? panel.getBoundingClientRect() : slot.getBoundingClientRect();
  const panelStyle = panel ? getComputedStyle(panel) : null;
  const panelPadding = panelStyle ? parseFloat(panelStyle.paddingLeft) + parseFloat(panelStyle.paddingRight) : 0;
  const fullSlotWidth = Math.max(0, panelRect.width - panelPadding);
  if (!rect.width || !rect.height || !fullSlotWidth) return;
  const aspect = rect.width / rect.height;
  const height = (fullSlotWidth / aspect) / 3.15;
  slot.style.setProperty('--cell-aspect', aspect.toFixed(4));
  slot.style.setProperty('--right-question-height', height.toFixed(1) + 'px');
}

const originalRenderForAspect = render;
render = function() {
  originalRenderForAspect();
  setTimeout(syncZoomSlotAspect, 0);
};
window.addEventListener('resize', function() { setTimeout(syncZoomSlotAspect, 0); });

const panelToggle = document.getElementById('panelToggle');
const boardToggle = document.getElementById('boardToggle');
const layoutEl = document.querySelector('.layout');
const outlineBox = document.getElementById('outlineBox');
function currentOutlineIndex() {
  if (selectedQ >= 0) return selectedQ;
  if (shownQ >= 0) return shownQ;
  if (zoomLocked >= 0) return zoomLocked;
  return 0;
}
function escapeOutlineHtml(text) {
  return String(text || '').replace(/[&<>"']/g, function(ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function outlineLabel(text) {
  return '<span class="inline-stage-label">' + escapeOutlineHtml(text) + '</span>';
}
function updateOutlineBox() {
  if (!outlineBox) return;
  const idx = currentOutlineIndex();
  const outlineText = outlines[idx] || '';
  if (layoutEl && layoutEl.classList.contains('outline-mode') && tales[idx]) {
    outlineBox.innerHTML = escapeOutlineHtml(outlineText) + '\n\n' +
      outlineLabel('原以為') + '\n' + escapeOutlineHtml(tales[idx][0]) + '\n\n' +
      outlineLabel('沒想到') + '\n' + escapeOutlineHtml(tales[idx][1]) + '\n\n' +
      outlineLabel('最後') + '\n' + escapeOutlineHtml(tales[idx][2]);
  } else {
    outlineBox.textContent = outlineText;
  }
}
function togglePanel() {
  const collapsed = layoutEl.classList.toggle('panel-collapsed');
  panelToggle.classList.toggle('active', collapsed);
  panelToggle.setAttribute('aria-expanded', String(!collapsed));
  setTimeout(syncZoomSlotAspect, 220);
}
function toggleBoard() {
  const collapsed = layoutEl.classList.toggle('board-collapsed');
  if (collapsed) updateOutlineBox();
  boardToggle.classList.toggle('active', collapsed);
  boardToggle.setAttribute('aria-expanded', String(!collapsed));
  if (collapsed) {
    board.classList.remove('dim-active');
    Array.from(board.children).forEach(function(c) { c.classList.remove('hovering'); });
  }
  setTimeout(syncZoomSlotAspect, 220);
}

zoomBox.onclick = function(e) {
  e.stopPropagation();
  if (shownQ !== -1 && zoomLocked === shownQ) {
    toggleTale();
  }
};
updateOutlineBox();
hideStory();
render();


// 2026-07-05 修改：右側欄 hover 時，左側表格全部變淡
panel.addEventListener('mouseenter', function() {
  layoutEl.classList.add('panel-hover');
});
panel.addEventListener('mouseleave', function() {
  layoutEl.classList.remove('panel-hover');
});


// 2026-07-05 修改：取消右上題目欄互動，改為點左側題目直接顯示故事
let currentZoomIndex = -1;
const originalShowZoomForClickReveal = showZoom;
showZoom = function(i, cell, locked) {
  currentZoomIndex = i;
  originalShowZoomForClickReveal(i, cell, locked);
};

function hideRightStoryContentOnly() {
  qnum.innerHTML = '<span class="qnum-value"></span>';
  qnum.style.display = 'none';
  s1.textContent = '';
  s2.textContent = '';
  s3.textContent = '';
  storyarea.style.display = 'none';
  placeholder.style.display = 'none';
}

function revealStoryFromTopQuestion() {
  return;
}


// 2026-07-05 修改：左側收合後，把故事改成對應題目的約兩百字故事大綱
function showOutlineInStoryColumns(idx) {
  const useIdx = (typeof idx === 'number' && idx >= 0) ? idx : currentOutlineIndex();
  layoutEl.classList.add('outline-mode');
  shownQ = useIdx;
  selectedQ = useIdx;
  qnum.innerHTML = '<span class="qnum-value">' + stories[useIdx] + '</span>';
  qnum.style.display = 'flex';
  updateOutlineBox();
  s1.textContent = tales[useIdx][0];
  s2.textContent = tales[useIdx][1];
  s3.textContent = tales[useIdx][2];
  storyarea.style.display = 'flex';
  placeholder.style.display = 'none';
}

const originalToggleBoardForOutlineColumns = toggleBoard;
toggleBoard = function() {
  originalToggleBoardForOutlineColumns();
  if (layoutEl.classList.contains('board-collapsed')) {
    showOutlineInStoryColumns(currentOutlineIndex());
  } else {
    layoutEl.classList.remove('outline-mode');
    hideRightStoryContentOnly();
  }
};


// 2026-07-05 修改：初始畫面顯示十六格內容，並新增一鍵復原
function restoreInitialScreen() {
  lit = Array(CELL_COUNT).fill(false);
  over = false;
  winCells = null;
  shownQ = -1;
  selectedQ = -1;
  zoomLocked = -1;
  currentZoomIndex = -1;

  layoutEl.classList.remove('board-collapsed', 'panel-collapsed', 'outline-mode', 'panel-hover', 'left-board-hover');
  if (boardToggle) {
    boardToggle.classList.remove('active');
    boardToggle.setAttribute('aria-expanded', 'true');
  }
  if (panelToggle) {
    panelToggle.classList.remove('active');
    panelToggle.setAttribute('aria-expanded', 'true');
  }

  status.textContent = '';
  status.className = '';
  qnum.innerHTML = '<span class="qnum-value"></span>';
  qnum.style.display = 'none';
  medbtn.style.display = 'none';
  placeholder.style.display = 'none';
  s1.textContent = '';
  s2.textContent = '';
  s3.textContent = '';
  storyarea.style.display = 'none';
  zoomBox.style.display = 'none';
  zoomBox.classList.remove('locked');
  board.classList.remove('zooming', 'locked-view', 'dim-active');
  render();
  setTimeout(syncZoomSlotAspect, 0);
}

const oldResetGameForRestore = resetGame;
resetGame = restoreInitialScreen;

restoreInitialScreen();

</script>
